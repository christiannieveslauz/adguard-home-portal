<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sitio bloqueado / Site blocked · AdGuard Home Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23cd201f' d='M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5z'/%3E%3C/svg%3E">
<style>
:root{--bg:#f5f7fb;--card:#fff;--line:rgba(0,40,100,.12);--text:#495057;--head:#212529;--mute:#9aa0ac;--green:#67b279;--green-d:#579a67;--red:#cd201f;--red-bg:#fdf1f1;--top:#fff}
@media (prefers-color-scheme: dark){:root{--bg:#131313;--card:#1f1f1f;--line:#2f2f2f;--text:#d4d4d4;--head:#f2f2f2;--mute:#8a8a8a;--red:#ef5350;--red-bg:#2a1b1b;--top:#1a1a1a}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font:15px/1.55 "Source Sans Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg)}
.topbar{background:var(--top);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1000px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;color:var(--head)}
.topbar svg{width:30px;height:30px}.topbar b{color:var(--green)}
main{max-width:620px;margin:56px auto;padding:0 20px}
.card{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--red);border-radius:3px;box-shadow:0 1px 2px rgba(0,0,0,.05);padding:36px 32px;text-align:center}
.icon{width:76px;height:76px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:var(--red-bg)}
.icon svg{width:42px;height:42px}
h1{margin:0 0 6px;font-size:24px;font-weight:600;color:var(--head)}
.dom{display:inline-block;margin:12px 0 8px;padding:7px 14px;border-radius:3px;background:var(--red-bg);color:var(--red);font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;font-weight:600;word-break:break-all}
p{margin:10px 0;color:var(--text)}
.btn{display:inline-block;margin-top:20px;padding:10px 20px;border-radius:3px;background:var(--green);color:#fff;font-weight:600;font-size:14px;text-decoration:none}
.btn:hover{background:var(--green-d)}
.foot{margin-top:18px;font-size:12px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<nav class="topbar"><div class="in">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#67b279" d="M12 1.5 3.5 4.6v6.2c0 5.4 3.6 10.3 8.5 11.7 4.9-1.4 8.5-6.3 8.5-11.7V4.6z"/><path fill="#fff" d="m10.6 15.6-3.4-3.4 1.4-1.4 2 2 4.8-4.8 1.4 1.4z"/></svg>
  <span>AdGuard Home <b>Portal</b></span>
</div></nav>
<main>
  <div class="card">
    <div class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#cd201f" d="M12 1.5 3.5 4.6v6.2c0 5.4 3.6 10.3 8.5 11.7 4.9-1.4 8.5-6.3 8.5-11.7V4.6zm3.5 12.6-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1-2.1-2.1 1.4-1.4 2.1 2.1 2.1-2.1 1.4 1.4-2.1 2.1z"/></svg></div>
    <h1 id="t1">Este sitio está bloqueado</h1>
    <div class="dom" id="dom"></div>
    <p id="t2">AdGuard Home bloqueó este dominio porque figura en una lista de publicidad, rastreo o seguridad de la red.</p>
    <p id="t3">Si lo necesitás, podés ver qué lista lo bloquea y desbloquearlo.</p>
    <a class="btn" id="go" href="__ADMIN_URL__">Ver por qué y desbloquear</a>
  </div>
  <div class="foot">AdGuard Home Portal · <span id="when"></span></div>
</main>
<script>
const EN = {t1: "This site is blocked",
  t2: "AdGuard Home blocked this domain because it appears on one of the network's advertising, tracking or security lists.",
  t3: "If you need it, you can see which list blocks it and unblock it.",
  go: "See why and unblock", dom: "this domain"};
const lang = (navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en";
document.documentElement.lang = lang;
if (lang === "en") { for (const k of ["t1","t2","t3","go"]) document.getElementById(k).textContent = EN[k]; document.title = "Site blocked · AdGuard Home Portal"; }
else { document.title = "Sitio bloqueado · AdGuard Home Portal"; }
const h = location.hostname;
document.getElementById('dom').textContent = h || (lang === "en" ? EN.dom : "este dominio");
document.getElementById('go').href = "__ADMIN_URL__/?d=" + encodeURIComponent(h);
document.getElementById('when').textContent = new Date().toLocaleString(lang);
</script>
</body>
</html>
