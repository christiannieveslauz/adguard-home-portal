# Responde a CUALQUIER dominio: es la IP que AdGuard devuelve para lo bloqueado.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Certificado autofirmado: en HTTPS el navegador avisará igual (es inevitable),
    # pero si se continúa se ve la página de bloqueo.
    ssl_certificate     /certs/portal.crt;
    ssl_certificate_key /certs/portal.key;

    access_log off;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store" always;

    location = /favicon.ico { return 204; }
    location / {
        # Navegadores: página. Rastreadores/recursos: respuesta vacía y rápida.
        if ($http_accept !~* "text/html") { return 204; }
        try_files /index.html =404;
    }
}
