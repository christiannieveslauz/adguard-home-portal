<!doctype html>
<html lang="{{ get_lang() }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf" content="{{ csrf_token() }}">
<title>{% block title %}{{ site_title }}{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2367b279' d='M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5z'/%3E%3C/svg%3E">
<style>
/* Paleta y formas inspiradas en la interfaz de AdGuard Home (Tabler). */
:root{
  --bg:#f5f7fb; --card:#fff; --line:rgba(0,40,100,.12); --text:#495057; --head:#212529; --mute:#9aa0ac;
  --green:#67b279; --green-d:#579a67; --red:#cd201f; --red-bg:#fdf1f1; --green-bg:#eef8f0; --yellow:#f1c40f; --yellow-bg:#fef9e7;
  --input:#fff; --shadow:0 1px 2px rgba(0,0,0,.05); --top:#fff;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#131313; --card:#1f1f1f; --line:#2f2f2f; --text:#d4d4d4; --head:#f2f2f2; --mute:#8a8a8a;
  --red:#ef5350; --red-bg:#2a1b1b; --green-bg:#1b2a1f; --yellow-bg:#2b2716; --input:#262626; --top:#1a1a1a; --shadow:none;
}}
*{box-sizing:border-box} html,body{margin:0}
body{font:15px/1.5 "Source Sans Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg);min-height:100vh}
a{color:var(--green);text-decoration:none} a:hover{text-decoration:underline}
.topbar{background:var(--top);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:var(--head);font-weight:600;font-size:18px}
.brand svg{width:30px;height:30px}
.brand b{color:var(--green);font-weight:700}
.navlinks{display:flex;gap:4px;margin-left:24px}
.navlinks a{color:var(--mute);padding:6px 12px;border-radius:4px;font-size:14px}
.navlinks a:hover{color:var(--green);text-decoration:none}
.topbar .user{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--mute);font-size:14px}
@media(max-width:760px){.navlinks{display:none}}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
.page-title{font-size:24px;color:var(--head);font-weight:400;margin:4px 0 4px}
.page-sub{color:var(--mute);margin-bottom:22px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;box-shadow:var(--shadow);margin-bottom:24px}
.card-h{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card-h h2{font-size:17px;font-weight:600;color:var(--head);margin:0}
.card-b{padding:20px}
.grid{display:grid;gap:24px}
@media(min-width:960px){.grid.two{grid-template-columns:1.4fr .6fr}}
.grid .card{margin-bottom:0}
input,select,button{font:inherit;color:inherit}
.search{display:flex;gap:10px}
.form-control,.search input,.toolbar select,.toolbar input{background:var(--input);border:1px solid var(--line);border-radius:3px;padding:9px 12px;outline:none;color:var(--text)}
.search input{flex:1}
.form-control:focus,.search input:focus,.toolbar input:focus,.toolbar select:focus{border-color:#a3d1ae;box-shadow:0 0 0 2px rgba(103,178,121,.25)}
.btn{border:1px solid transparent;border-radius:3px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:14px;background:var(--green);color:#fff;white-space:nowrap;transition:background .15s}
.btn:hover{background:var(--green-d)}
.btn.ok{background:var(--green)} .btn.bad{background:var(--red)} .btn.bad:hover{filter:brightness(.92)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--text)} .btn.ghost:hover{border-color:var(--green);color:var(--green);background:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:wait}
.pill{display:inline-block;padding:2px 9px;border-radius:3px;font-size:12px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.pill.bloqueado{background:var(--red-bg);color:var(--red)} .pill.permitido{background:var(--green-bg);color:var(--green)}
.pill.reescrito,.pill.desconocido,.pill.error{background:var(--yellow-bg);color:#c79a00}
.result{margin-top:18px;display:none;border-top:1px solid var(--line);padding-top:18px} .result.show{display:block}
.result .dom{font-size:20px;font-weight:600;color:var(--head);word-break:break-all}
.rule{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);padding:7px 10px;border-radius:3px;margin-top:8px}
.muted{color:var(--mute)} .small{font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.5px;border-top:0;border-bottom:1px solid var(--line)}
td.d{word-break:break-all;color:var(--head);font-weight:600}
tr.blocked td{background:var(--red-bg)}
tr.blocked:hover td{filter:brightness(.98)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toast{position:fixed;right:20px;bottom:20px;background:var(--card);color:var(--text);border:1px solid var(--line);border-left:4px solid var(--green);padding:12px 16px;border-radius:3px;box-shadow:0 4px 16px rgba(0,0,0,.12);opacity:0;transform:translateY(10px);transition:.25s}
.toast.show{opacity:1;transform:none}
.center{min-height:100vh;display:grid;place-items:center;padding:20px}
.login{width:100%;max-width:400px}
.login .brand{justify-content:center;font-size:22px;margin-bottom:22px}
.login .brand svg{width:40px;height:40px}
.login label{display:block;font-size:14px;color:var(--head);font-weight:600;margin:14px 0 6px}
.login input{width:100%}
.login .btn{width:100%;margin-top:18px;padding:11px}
.sep{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:13px;margin:20px 0 4px}
.sep:before,.sep:after{content:"";flex:1;height:1px;background:var(--line)}
.err{background:var(--red-bg);color:var(--red);border:1px solid var(--red);padding:9px 12px;border-radius:3px;margin-bottom:6px;font-size:14px}
.foot{text-align:center;color:var(--mute);font-size:12px;margin-top:10px}
.lang b{color:var(--green)} .lang a{color:var(--mute)} .lang{font-size:13px}
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
